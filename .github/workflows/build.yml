# CMAKE_BUILD_TYPE=Release
# CMAKE_INSTALL_PREFIX=install
# LSL_BUILD_STATIC=ON/OFF
# LSL_FRAMEWORK=OFF
# LSL_BUNDLED_BOOST=ON/OFF
# LSL_FETCH_PUGIXML=ON/OFF
# LSL_TOOLS=ON
# LSL_UNITTESTS=ON
# LSL_INSTALL=ON

name: liblsl

on:
  push:
  pull_request:
    types: [ opened, ready_for_review, reopened, synchronize ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  INSTALL_PREFIX: install
  LIBLSL_VERSION: dev

jobs:
  build-matrix:
    name: verify-${{ matrix.os }}-${{ matrix.linkage }}-boost-${{ matrix.bundled_boost }}-pugixml-${{ matrix.fetch_pugixml }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        linkage:
          - static
          - shared
        bundled_boost:
          - ON
          - OFF
        fetch_pugixml:
          - ON
          - OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Clone liblsl
        shell: bash
        run: |
          git clone https://github.com/sccn/liblsl.git
          git -C liblsl checkout "${LIBLSL_VERSION}"

      - name: Install dependencies on Linux
        if: runner.os == 'Linux' && (matrix.bundled_boost == 'OFF' || matrix.fetch_pugixml == 'OFF')
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev libpugixml-dev

      - name: Install dependencies on macOS
        if: runner.os == 'macOS' && (matrix.bundled_boost == 'OFF' || matrix.fetch_pugixml == 'OFF')
        run: brew install boost pugixml

      - name: Install dependencies on Windows
        if: runner.os == 'Windows' && (matrix.bundled_boost == 'OFF' || matrix.fetch_pugixml == 'OFF')
        shell: pwsh
        run: |
          vcpkg install boost:x64-windows pugixml:x64-windows
          "VCPKG_TOOLCHAIN=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure liblsl
        shell: bash
        run: |
          cmake -S liblsl -B liblsl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/${INSTALL_PREFIX}" \
            -DLSL_BUILD_STATIC=${{ matrix.linkage == 'static' && 'ON' || 'OFF' }} \
            -DLSL_FRAMEWORK=OFF \
            -DLSL_BUNDLED_BOOST=${{ matrix.bundled_boost }} \
            -DLSL_FETCH_PUGIXML=${{ matrix.fetch_pugixml }} \
            -DLSL_TOOLS=ON \
            -DLSL_UNITTESTS=ON \
            -DLSL_INSTALL=ON \
            ${VCPKG_TOOLCHAIN}

      - name: Build and install liblsl
        shell: bash
        run: cmake --build liblsl-build --target install

      - name: Configure lslver
        shell: bash
        run: |
          cmake -S . -B lslver-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/${INSTALL_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/lslver-install" \
            ${VCPKG_TOOLCHAIN}

      - name: Build lslver
        shell: bash
        run: cmake --build lslver-build

      - name: Run lslver
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./lslver-build/lslver.exe
          else
            ./lslver-build/lslver
          fi
